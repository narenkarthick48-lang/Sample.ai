
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VISHU AI</title>
<link rel="stylesheet" href="style.css">
<style>
:root{--bg:#090909;--panel:#141414;--line:#2b2b2b;--text:#f5f5f5;--muted:#999;--accent:#d7ff64}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,system-ui,sans-serif;height:100dvh;overflow:hidden}
button,textarea,select{font:inherit}
button{cursor:pointer}
.app{height:100dvh;display:flex}
.sidebar{width:245px;flex-shrink:0;background:#0e0e0e;border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800;padding:6px}
.logo{width:35px;height:35px;background:var(--accent);color:#111;border-radius:11px;display:grid;place-items:center}
.newchat,.sidebtn{padding:12px;background:transparent;border:1px solid var(--line);border-radius:11px;color:white;text-align:left}
.newchat:hover,.sidebtn:hover{background:#202020}
.label{font-size:10px;color:var(--muted);letter-spacing:1.5px;padding:8px}
.history{display:flex;flex-direction:column;gap:4px;overflow:auto}
.history button{padding:10px;border:0;border-radius:8px;background:transparent;color:#aaa;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.history button:hover{background:#202020}
.profile{margin-top:auto;padding:15px 5px 3px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center}
.avatar{width:35px;height:35px;border-radius:50%;background:#252525;display:grid;place-items:center}
.profile small{color:var(--muted)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:62px;padding:0 20px;border-bottom:1px solid #222;display:flex;align-items:center;justify-content:space-between}
.topname{font-weight:700;font-size:14px}
.status{color:var(--accent);font-size:11px;border:1px solid #3b4527;background:#1a2110;padding:6px 9px;border-radius:20px}
.menu{display:none;background:none;color:white;border:0;font-size:23px}
.messages{flex:1;overflow:auto;padding:20px 16px;scroll-behavior:smooth}
.welcome{max-width:700px;margin:8vh auto 30px;text-align:center}
.biglogo{width:66px;height:66px;margin:0 auto 22px;border-radius:22px;background:var(--accent);color:#111;display:grid;place-items:center;font-size:30px;font-weight:900}
h1{font-size:clamp(32px,5vw,48px);letter-spacing:-2px;margin:0}
h1 span{color:var(--accent)}
.welcome p{color:var(--muted);font-size:14px;line-height:1.7;margin:12px 0 27px}
.suggestions{max-width:540px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:left}
.suggestion{padding:14px;min-height:76px;background:#111;border:1px solid var(--line);border-radius:13px;color:white;text-align:left}
.suggestion:hover{background:#1a1a1a;border-color:#555}
.suggestion b{display:block;font-size:13px;margin-bottom:6px}
.suggestion span{font-size:11px;color:var(--muted)}
.chatlist{max-width:780px;margin:auto}
.message{display:flex;gap:11px;margin:22px 0;align-items:flex-start}
.message.user{justify-content:flex-end}
.bubble{max-width:88%;font-size:14px;line-height:1.8;overflow-wrap:anywhere}
.user .bubble{background:#202020;padding:12px 15px;border-radius:17px 17px 4px 17px;white-space:pre-wrap}
.assistant .bubble{white-space:pre-wrap;padding:3px 0}
.minilogo{width:29px;height:29px;flex-shrink:0;border-radius:9px;background:var(--accent);color:#111;display:grid;place-items:center;font-size:11px;font-weight:bold}
.composerarea{padding:10px 14px 12px}
.composer{max-width:780px;margin:auto;background:#141414;border:1px solid #393939;border-radius:19px;padding:12px}
.composer:focus-within{border-color:#666}
textarea{width:100%;display:block;resize:none;max-height:145px;min-height:46px;background:transparent;color:white;border:0;outline:none;padding:8px 4px;font-size:15px;line-height:1.6}
textarea::placeholder{color:#777}
.tools{display:flex;align-items:center;justify-content:space-between;gap:7px}
.lefttools{display:flex;align-items:center;gap:7px;min-width:0}
.tool{height:36px;min-width:36px;padding:0 9px;background:#202020;border:1px solid #333;border-radius:10px;color:#eee}
select{height:36px;max-width:170px;min-width:0;padding:0 8px;background:#202020;border:1px solid #363636;border-radius:10px;color:white;font-size:12px;outline:none}
.send{width:39px;height:39px;flex-shrink:0;border:0;border-radius:12px;background:var(--accent);color:#111;font-weight:bold;font-size:19px}
#file{display:none}
#filename{display:none;color:var(--accent);font-size:11px;padding:5px}
.note{text-align:center;color:#6d6d6d;font-size:10px;padding-top:9px}
.overlay{display:none}
@media(max-width:650px){
.sidebar{position:fixed;z-index:6;top:0;bottom:0;left:-260px;transition:left .2s}
.sidebar.open{left:0}
.overlay.show{display:block;position:fixed;inset:0;background:#0009;z-index:5}
.menu{display:block}
.topbar{padding:0 13px}
.messages{padding:16px 12px}
.welcome{margin:8vh auto 25px}
.suggestions{gap:8px}
.suggestion{padding:11px}
.composerarea{padding:8px 9px 10px}
select{max-width:145px;font-size:11px}
.tool{padding:0 8px}
}
</style>
</head>
<body>
<div class="overlay" id="overlay" onclick="toggleMenu()"></div>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="brand"><div class="logo">V</div> VISHU AI</div>
  <button class="newchat" onclick="newChat()">＋ New chat</button>
  <div class="label">YOUR CONVERSATIONS</div>
  <div class="history" id="history"></div>
  <button class="sidebtn" onclick="showAbout()">⚙ About VISHU AI</button>
  <div class="profile"><div class="avatar">V</div><div><b>VISHU AI</b><br><small>Personal AI assistant</small></div></div>
</aside>

<main class="main">
  <header class="topbar">
    <div style="display:flex;align-items:center;gap:12px">
      <button class="menu" onclick="toggleMenu()">☰</button>
      <div class="topname">VISHU <span style="color:var(--accent)">AI</span></div>
    </div>
    <div class="status">● AI WORKSPACE</div>
  </header>

  <section class="messages" id="messages">
    <div class="welcome" id="welcome">
      <div class="biglogo">V</div>
      <h1>Welcome to <span>VISHU AI</span></h1>
      <p>Your ideas. Your questions. One AI workspace.<br>What would you like to explore today?</p>
      <div class="suggestions">
        <button class="suggestion" onclick="suggest('Help me learn Python from zero')"><b>⌘ Learn to code</b><span>Learn Python step by step</span></button>
        <button class="suggestion" onclick="suggest('Explain artificial intelligence simply')"><b>✳ Explore AI</b><span>Understand modern AI</span></button>
        <button class="suggestion" onclick="suggest('Help me build a college project')"><b>⌂ Build a project</b><span>Create something useful</span></button>
        <button class="suggestion" onclick="suggest('Give me ideas for solving real-world problems')"><b>↗ Generate ideas</b><span>Turn ideas into action</span></button>
      </div>
    </div>
    <div class="chatlist" id="chatlist"></div>
  </section>

  <footer class="composerarea">
    <div class="composer">
      <textarea id="prompt" rows="1" placeholder="Message VISHU AI..." oninput="resizeInput(this)" onkeydown="handleKey(event)"></textarea>
      <div id="filename"></div>
      <div class="tools">
        <div class="lefttools">
          <button class="tool" onclick="document.getElementById('file').click()" title="Attach image">＋</button>
          <input id="file" type="file" accept="image/*,.pdf,.txt" onchange="attachFile(this)">
          <select id="model" aria-label="Select AI model">
            <option value="auto">✦ Auto select AI</option>
            <option value="huggingface">Hugging Face</option>
            <option value="nvidia">NVIDIA</option>
            <option value="gemini">Gemini</option>
            <option value="openai">OpenAI</option>
            <option value="claude">Claude</option>
          </select>
        </div>
        <button class="send" id="send" onclick="sendMessage()">↑</button>
      </div>
    </div>
    <div class="note">VISHU AI can make mistakes. Verify important information.</div>
  </footer>
</main>
</div>

<script>
const $ = id => document.getElementById(id);
let attachedFile = null;
let conversations = [];
let currentConversation = [];

function toggleMenu(){
  $('sidebar').classList.toggle('open');
  $('overlay').classList.toggle('show');
}
function resizeInput(el){
  el.style.height='auto';
  el.style.height=Math.min(el.scrollHeight,145)+'px';
}
function handleKey(e){
  if(e.key==='Enter'&&!e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
}
function attachFile(input){
  attachedFile=input.files[0]||null;
  $('filename').style.display=attachedFile?'block':'none';
  $('filename').textContent=attachedFile?'📎 '+attachedFile.name:'';
}
function suggest(text){
  $('prompt').value=text;
  sendMessage();
}
function addMessage(text,role){
  const row=document.createElement('div');
  row.className='message '+role;
  const bubble=document.createElement('div');
  bubble.className='bubble';
  bubble.textContent=text;
  if(role==='assistant'){
    const logo=document.createElement('div');
    logo.className='minilogo';
    logo.textContent='V';
    row.append(logo,bubble);
  }else row.append(bubble);
  $('chatlist').append(row);
  $('messages').scrollTop=$('messages').scrollHeight;
  return bubble;
}
function renderHistory(){
  $('history').replaceChildren();
  conversations.slice().reverse().forEach((chat,index)=>{
    const b=document.createElement('button');
    b.textContent=chat.title;
    b.onclick=()=>loadConversation(conversations.length-1-index);
    $('history').append(b);
  });
}
function saveConversation(){
  if(!currentConversation.length)return;
  const first=currentConversation.find(m=>m.role==='user');
  const title=first?first.text.slice(0,32):'New chat';
  const last=conversations[conversations.length-1];
  if(last&&last.id===activeId){
    last.title=title;
    last.messages=currentConversation.slice();
  }else{
    conversations.push({id:activeId,title,messages:currentConversation.slice()});
  }
  renderHistory();
}
let activeId=Date.now();
function newChat(){
  saveConversation();
  activeId=Date.now();
  currentConversation=[];
  $('chatlist').replaceChildren();
  $('welcome').style.display='block';
  $('prompt').value='';
  $('prompt').focus();
  $('sidebar').classList.remove('open');
  $('overlay').classList.remove('show');
}
function loadConversation(index){
  const chat=conversations[index];
  if(!chat)return;
  activeId=chat.id;
  currentConversation=chat.messages.slice();
  $('chatlist').replaceChildren();
  $('welcome').style.display='none';
  currentConversation.forEach(m=>addMessage(m.text,m.role));
  $('sidebar').classList.remove('open');
  $('overlay').classList.remove('show');
}
function showAbout(){
  alert('VISHU AI\\nOne workspace for multiple AI providers.\\nConnect a secure backend to enable real AI answers.');
}
async function sendMessage(){
  const text=$('prompt').value.trim();
  if(!text&&!attachedFile)return;
  if(!text&&attachedFile){
    addMessage('Please type a question about '+attachedFile.name,'assistant');
    return;
  }

  $('welcome').style.display='none';
  addMessage(text,'user');
  currentConversation.push({role:'user',text});
  $('prompt').value='';
  resizeInput($('prompt'));

  const model=$('model').value;
  const image=attachedFile;
  attachedFile=null;
  $('file').value='';
  $('filename').style.display='none';
  $('send').disabled=true;
  const bubble=addMessage('Connecting to VISHU AI...','assistant');

  try{
    // Configure your own backend URL after deploying the backend.
    const API_URL='';
    if(!API_URL){
      throw new Error('BACKEND_NOT_CONFIGURED');
    }
    const response=await fetch(API_URL,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        message:text,
        model:model,
        conversation:currentConversation,
        imageName:image?image.name:null
      })
    });
    if(!response.ok)throw new Error('Request failed: '+response.status);
    const data=await response.json();
    const answer=data.reply||data.answer||'No answer received.';
    bubble.textContent=answer;
    currentConversation.push({role:'assistant',text:answer});
    saveConversation();
  }catch(error){
    bubble.textContent='VISHU AI frontend is ready, but the AI backend is not connected yet. Next, connect the Hugging Face API through a secure backend to receive real AI answers.';
  }finally{
    $('send').disabled=false;
    $('prompt').focus();
    $('messages').scrollTop=$('messages').scrollHeight;
  }
}
</script>
<script src="app.js"></script>
</body>
</html>
